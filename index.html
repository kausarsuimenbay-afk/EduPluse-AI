<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EduPulse AI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #171923;
    padding-bottom: 80px;
}

header {
    background: white;
    padding: 18px 20px;
    position: sticky;
    top: 0;
    z-index: 10;
    border-bottom: 1px solid #e8eaf0;
}

.logo {
    font-size: 22px;
    font-weight: 800;
}

.logo span {
    color: #6c63ff;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

h1 {
    font-size: 28px;
    margin-bottom: 8px;
}

.subtitle {
    color: #6b7280;
    margin-bottom: 20px;
}

.search {
    width: 100%;
    padding: 14px 16px;
    border: 1px solid #ddd;
    border-radius: 14px;
    font-size: 15px;
    margin-bottom: 15px;
    outline: none;
}

.filters {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    margin-bottom: 20px;
}

.filter {
    border: none;
    background: white;
    padding: 10px 15px;
    border-radius: 20px;
    cursor: pointer;
    white-space: nowrap;
}

.filter.active {
    background: #6c63ff;
    color: white;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 14px;
    box-shadow: 0 4px 15px rgba(0,0,0,.05);
}

.card-top {
    display: flex;
    justify-content: space-between;
    gap: 10px;
}

.card h3 {
    font-size: 18px;
    margin-bottom: 7px;
}

.type {
    display: inline-block;
    background: #eeeaff;
    color: #5b52d6;
    padding: 5px 9px;
    border-radius: 8px;
    font-size: 12px;
    margin-bottom: 10px;
}

.info {
    color: #626878;
    font-size: 14px;
    line-height: 1.6;
}

.portfolio {
    margin-top: 12px;
    padding: 10px;
    border-radius: 10px;
    background: #f3f4ff;
    font-size: 13px;
}

.buttons {
    display: flex;
    gap: 8px;
    margin-top: 15px;
}

button {
    font-family: inherit;
}

.primary {
    flex: 1;
    border: none;
    background: #6c63ff;
    color: white;
    padding: 12px;
    border-radius: 11px;
    cursor: pointer;
}

.secondary {
    border: 1px solid #ddd;
    background: white;
    padding: 12px 15px;
    border-radius: 11px;
    cursor: pointer;
}

.favorite {
    font-size: 24px;
    border: none;
    background: none;
    cursor: pointer;
}

.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 68px;
    background: white;
    border-top: 1px solid #ddd;
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 20;
}

.nav-btn {
    border: none;
    background: none;
    color: #777;
    cursor: pointer;
    font-size: 12px;
}

.nav-btn div {
    font-size: 23px;
    margin-bottom: 3px;
}

.nav-btn.active {
    color: #6c63ff;
    font-weight: bold;
}

.page {
    display: none;
}

.page.active {
    display: block;
}

/* AI */

.ai-box {
    background: linear-gradient(135deg, #6c63ff, #8f88ff);
    color: white;
    padding: 25px;
    border-radius: 22px;
    margin-bottom: 20px;
}

.ai-box h2 {
    margin-bottom: 8px;
}

.ai-box p {
    opacity: .9;
}

.question {
    background: white;
    padding: 20px;
    border-radius: 18px;
    margin-bottom: 15px;
}

.question h3 {
    margin-bottom: 15px;
}

.options {
    display: grid;
    gap: 10px;
}

.option {
    padding: 13px;
    border: 1px solid #ddd;
    background: white;
    border-radius: 12px;
    text-align: left;
    cursor: pointer;
}

.option.selected {
    border-color: #6c63ff;
    background: #f0efff;
}

.ai-result {
    margin-top: 20px;
}

.empty {
    text-align: center;
    padding: 50px 20px;
    color: #777;
}

/* modal */

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
}

.modal.active {
    display: flex;
}

.modal-content {
    background: white;
    width: 100%;
    max-width: 500px;
    max-height: 90vh;
    overflow-y: auto;
    border-radius: 22px;
    padding: 22px;
}

.close {
    float: right;
    border: none;
    background: none;
    font-size: 25px;
    cursor: pointer;
}

.modal h2 {
    margin: 15px 0;
}

.modal p {
    line-height: 1.7;
    color: #555;
    margin-bottom: 12px;
}

@media(max-width:600px) {
    h1 {
        font-size: 25px;
    }

    .container {
        padding: 16px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">EduPulse <span>AI</span></div>
</header>


<!-- HOME -->

<div id="home" class="page active">

<div class="container">

<h1>Возможности рядом 🎯</h1>

<p class="subtitle">
Олимпиады, конкурсы, дебаты и проекты в одном месте
</p>

<input
    id="search"
    class="search"
    placeholder="🔎 Найти олимпиаду, конкурс..."
    oninput="renderEvents()"
>

<div class="filters">

<button class="filter active" onclick="setFilter('Все',this)">
Все
</button>

<button class="filter" onclick="setFilter('Олимпиада',this)">
Олимпиады
</button>

<button class="filter" onclick="setFilter('Дебаты',this)">
Дебаты
</button>

<button class="filter" onclick="setFilter('Конкурс',this)">
Конкурсы
</button>

<button class="filter" onclick="setFilter('Проект',this)">
Проекты
</button>

</div>

<div id="events"></div>

</div>
</div>


<!-- AI -->

<div id="ai" class="page">

<div class="container">

<div class="ai-box">

<h2>🤖 EduPulse AI</h2>

<p>
Расскажи о своих интересах, и мы подберём подходящие мероприятия.
</p>

</div>

<div class="question">

<h3>1. Какое направление тебе интересно?</h3>

<div class="options">

<button class="option" onclick="selectOption(this,'math')">
📐 Математика
</button>

<button class="option" onclick="selectOption(this,'it')">
💻 IT
</button>

<button class="option" onclick="selectOption(this,'business')">
💼 Бизнес
</button>

<button class="option" onclick="selectOption(this,'design')">
🎨 Дизайн
</button>

<button class="option" onclick="selectOption(this,'science')">
🔬 Наука
</button>

</div>

</div>


<div class="question">

<h3>2. Для чего ты ищешь мероприятия?</h3>

<div class="options">

<button class="option goal" onclick="selectGoal(this,'portfolio')">
🎓 Улучшить портфолио
</button>

<button class="option goal" onclick="selectGoal(this,'experience')">
🚀 Получить опыт
</button>

<button class="option goal" onclick="selectGoal(this,'team')">
👥 Найти команду
</button>

</div>

</div>

<button class="primary" onclick="getRecommendations()">
✨ Подобрать для меня
</button>

<div id="aiResult" class="ai-result"></div>

</div>
</div>


<!-- FAVORITES -->

<div id="favorites" class="page">

<div class="container">

<h1>Мои мероприятия ❤️</h1>

<p class="subtitle">
Сохранённые олимпиады и конкурсы
</p>

<div id="favoriteEvents"></div>

</div>
</div>


<!-- MODAL -->

<div id="modal" class="modal">

<div class="modal-content">

<button class="close" onclick="closeModal()">×</button>

<div id="modalBody"></div>

</div>

</div>


<!-- NAVIGATION -->

<div class="bottom-nav">

<button class="nav-btn active" onclick="showPage('home',this)">
<div>🏠</div>
Лента
</button>

<button class="nav-btn" onclick="showPage('ai',this)">
<div>🤖</div>
AI
</button>

<button class="nav-btn" onclick="showPage('favorites',this)">
<div>❤️</div>
Мои
</button>

</div>


<script>

const events = [

{
id:1,
title:"Республиканская олимпиада по математике",
type:"Олимпиада",
date:"25 сентября 2026",
deadline:"23 сентября",
direction:"math",
level:"Республика",
portfolio:"Высокая",
description:"Соревнование для школьников, интересующихся математикой. Участники решают задачи повышенной сложности."
},

{
id:2,
title:"Math Challenge",
type:"Олимпиада",
date:"30 сентября 2026",
deadline:"28 сентября",
direction:"math",
level:"Международный",
portfolio:"Высокая",
description:"Математический конкурс для школьников. Хороший вариант для проверки своих знаний и пополнения портфолио."
},

{
id:3,
title:"NIS Debate Cup",
type:"Дебаты",
date:"28 сентября 2026",
deadline:"25 сентября",
direction:"business",
level:"Республиканский",
portfolio:"Высокая",
description:"Командный дебатный турнир. Помогает развивать аргументацию, публичные выступления и командную работу."
},

{
id:4,
title:"Kazakhstan IT Hackathon",
type:"Проект",
date:"5 октября 2026",
deadline:"1 октября",
direction:"it",
level:"Республика",
portfolio:"Высокая",
description:"Хакатон для школьников. Участники создают собственные цифровые проекты."
},

{
id:5,
title:"Young Scientists Competition",
type:"Конкурс",
date:"10 октября 2026",
deadline:"5 октября",
direction:"science",
level:"Международный",
portfolio:"Высокая",
description:"Научный конкурс для школьников. Можно представить собственное исследование или проект."
},

{
id:6,
title:"School Design Challenge",
type:"Конкурс",
date:"12 октября 2026",
deadline:"8 октября",
direction:"design",
level:"Республиканский",
portfolio:"Средняя",
description:"Конкурс дизайнерских работ для школьников."
},

{
id:7,
title:"Startup Challenge",
type:"Проект",
date:"15 октября 2026",
deadline:"10 октября",
direction:"business",
level:"Республика",
portfolio:"Высокая",
description:"Командный конкурс стартапов. Участники представляют бизнес-идею и прототип."
}

];


let currentFilter = "Все";

let selectedDirection = null;
let selectedGoal = null;


function renderEvents() {

const container = document.getElementById("events");

const search =
document.getElementById("search").value.toLowerCase();

let filtered = events.filter(event => {

const matchesFilter =
currentFilter === "Все" ||
event.type === currentFilter;

const matchesSearch =
event.title.toLowerCase().includes(search);

return matchesFilter && matchesSearch;

});


if(filtered.length === 0){

container.innerHTML =
`<div class="empty">
🔎 Ничего не найдено
</div>`;

return;

}


container.innerHTML = filtered.map(createCard).join("");

}


function createCard(event) {

const isFavorite =
getFavorites().includes(event.id);

return `

<div class="card">

<div class="card-top">

<div>

<span class="type">
${event.type}
</span>

<h3>${event.title}</h3>

</div>

<button
class="favorite"
onclick="toggleFavorite(${event.id})">

${isFavorite ? "❤️" : "♡"}

</button>

</div>

<div class="info">

📅 ${event.date}<br>

⏳ Дедлайн: ${event.deadline}<br>

🏆 Уровень: ${event.level}

</div>

<div class="portfolio">

🎓 Для портфолио: <b>${event.portfolio}</b>
</div>

<div class="buttons">

<button
class="primary"
onclick="openEvent(${event.id})">

Подробнее

</button>

<button
class="secondary"
onclick="addCalendar('${event.title}','${event.date}')">

📅

</button>

</div>

</div>

`;

}


function setFilter(filter,button){

currentFilter = filter;

document
.querySelectorAll(".filter")
.forEach(x=>x.classList.remove("active"));

button.classList.add("active");

renderEvents();

}


function getFavorites(){

return JSON.parse(
localStorage.getItem("edupulse_favorites") || "[]"
);

}


function toggleFavorite(id){

let favorites = getFavorites();

if(favorites.includes(id)){

favorites =
favorites.filter(x=>x !== id);

}else{

favorites.push(id);

}

localStorage.setItem(
"edupulse_favorites",
JSON.stringify(favorites)
);

renderEvents();
renderFavorites();

}


function renderFavorites(){

const container =
document.getElementById("favoriteEvents");

const favorites = getFavorites();

const saved =
events.filter(e=>favorites.includes(e.id));


if(saved.length === 0){

container.innerHTML = `

<div class="empty">

❤️

<h3>Пока ничего нет</h3>

<p>Сохрани интересные мероприятия из ленты.</p>

</div>

`;

return;

}


container.innerHTML =
saved.map(createCard).join("");

}


function openEvent(id){

const event =
events.find(e=>e.id === id);

document.getElementById("modalBody").innerHTML = `

<span class="type">${event.type}</span>

<h2>${event.title}</h2>

<p>
📅 <b>Дата:</b> ${event.date}
</p>

<p>
⏳ <b>Дедлайн:</b> ${event.deadline}
</p>

<p>
🏆 <b>Уровень:</b> ${event.level}
</p>

<p>
🎓 <b>Польза для портфолио:</b>
${event.portfolio}
</p>

<p>
${event.description}
</p>

<button
class="primary"
onclick="toggleFavorite(${event.id});closeModal();">

❤️ Сохранить

</button>

`;

document
.getElementById("modal")
.classList.add("active");

}


function closeModal(){

document
.getElementById("modal")
.classList.remove("active");

}


function showPage(page,button){

document
.querySelectorAll(".page")
.forEach(p=>p.classList.remove("active"));

document
.getElementById(page)
.classList.add("active");

document
.querySelectorAll(".nav-btn")
.forEach(b=>b.classList.remove("active"));

button.classList.add("active");

if(page === "favorites"){
renderFavorites();
}

}


function selectOption(button,direction){

document
.querySelectorAll(".options .option")
.forEach(b=>{

if(!b.classList.contains("goal"))
b.classList.remove("selected");

});

button.classList.add("selected");

selectedDirection = direction;

}


function selectGoal(button,goal){

document
.querySelectorAll(".goal")
.forEach(b=>b.classList.remove("selected"));

button.classList.add("selected");

selectedGoal = goal;

}


function getRecommendations(){

const result =
document.getElementById("aiResult");

if(!selectedDirection){

result.innerHTML = `

<div class="card">

⚠️ Сначала выбери интересующее направление.

</div>

`;

return;

}


let recommended =
events.filter(e=>e.direction === selectedDirection);


if(selectedGoal === "portfolio"){

recommended =
recommended.filter(
e=>e.portfolio === "Высокая"
);

}


if(recommended.length === 0){

result.innerHTML = `

<div class="card">

😔 Пока нет подходящих мероприятий.

</div>

`;

return;

}


result.innerHTML = `

<h2 style="margin:20px 0 12px">
🎯 Подходящие тебе мероприятия
</h2>

<p style="color:#666;margin-bottom:15px">

AI подобрал мероприятия на основе твоих интересов.

</p>

${recommended.map(createCard).join("")}

`;

}


function addCalendar(title,date){

alert(
`📅 "${title}" добавлено в календарь!

Дата: ${date}

В полноценной версии здесь будет автоматическое добавление в Google Calendar / Apple Calendar.`
);

}


renderEvents();
renderFavorites();

</script>

</body>
</html>
